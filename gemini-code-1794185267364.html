<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oman National Day Energy Challenge</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka+One&family=Quicksand:wght@500;600;700;800&display=swap');
    
    body {
        font-family: 'Quicksand', sans-serif;
        background-color: #0b1a10;
        color: #f8fafc;
        user-select: none;
        overflow: hidden; /* Prevent body scrolling */
    }

    .font-game {
        font-family: 'Fredoka One', cursive;
    }

    /* Omani Patriotic Flag Accent Strip */
    .oman-flag-strip {
        background: linear-gradient(90deg, #d97706 0%, #dc2626 33.3%, #ffffff 33.3%, #ffffff 66.6%, #16a34a 66.6%, #16a34a 100%);
    }

    /* Playful Animated Omani Background Elements */
    .bg-bubble {
        position: absolute;
        border-radius: 50%;
        filter: blur(45px);
        opacity: 0.35;
        animation: floatBubble 12s infinite alternate ease-in-out;
        pointer-events: none;
    }

    @keyframes floatBubble {
        0% { transform: translateY(0px) scale(1) rotate(0deg); }
        50% { transform: translateY(-30px) scale(1.15) rotate(180deg); }
        100% { transform: translateY(20px) scale(0.9) rotate(360deg); }
    }

    /* Floating Omani Celebrating Icons */
    .floating-icon {
        position: absolute;
        opacity: 0.15;
        pointer-events: none;
        animation: floatIcon 8s infinite alternate ease-in-out;
    }

    @keyframes floatIcon {
        0% { transform: translateY(0px) rotate(-10deg); }
        100% { transform: translateY(-25px) rotate(15deg); }
    }

    /* Vibrant Glassmorphism Card Style */
    .quadrant-card {
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        backdrop-filter: blur(16px);
    }

    .quadrant-card:hover {
        transform: translateY(-2px);
    }

    /* Omani Color Glow Animations */
    .glow-red { box-shadow: 0 0 25px -5px rgba(220, 38, 38, 0.45); }
    .glow-gold { box-shadow: 0 0 25px -5px rgba(234, 179, 8, 0.45); }
    .glow-green { box-shadow: 0 0 25px -5px rgba(22, 163, 74, 0.45); }
    .glow-white { box-shadow: 0 0 25px -5px rgba(255, 255, 255, 0.35); }

    /* Custom Animations */
    @keyframes floatStar {
        0% { transform: translateY(10px) scale(0.4); opacity: 0; }
        50% { opacity: 1; transform: translateY(-20px) scale(1.3); }
        100% { transform: translateY(-40px) scale(1); opacity: 0; }
    }

    .animate-star {
        animation: floatStar 1.1s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes shake {
        0%, 100% { transform: translateX(0); }
        20%, 60% { transform: translateX(-10px); }
        40%, 80% { transform: translateX(10px); }
    }

    .shake-element {
        animation: shake 0.45s ease-in-out;
    }

    /* Option Button Hover Effects */
    .option-btn {
        transition: all 0.15s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .option-btn:hover {
        transform: scale(1.015);
    }
    .option-btn:active {
        transform: scale(0.985);
    }
</style>
</head>
<body class="bg-slate-950 h-screen w-screen text-slate-100 flex flex-col relative overflow-hidden">
<!-- Omani National Color Background Orbs -->
<div class="bg-bubble w-96 h-96 bg-red-600 top-[-5%] left-[-5%]"></div>
<div class="bg-bubble w-96 h-96 bg-emerald-600 top-[40%] right-[-10%]" style="animation-delay: -3s;"></div>
<div class="bg-bubble w-96 h-96 bg-amber-500 bottom-[-10%] left-[20%]" style="animation-delay: -6s;"></div>
<div class="bg-bubble w-80 h-80 bg-slate-100 top-[10%] right-[30%]" style="animation-delay: -9s;"></div>

<!-- Floating Omani Cultural Doodles -->
<i class="fa-solid fa-flag floating-icon text-red-500 text-5xl top-10 left-8" style="animation-delay: 0s;"></i>
<i class="fa-solid fa-crown floating-icon text-amber-400 text-4xl top-1/3 left-1/2" style="animation-delay: -2s;"></i>
<i class="fa-solid fa-star floating-icon text-emerald-400 text-5xl bottom-12 right-12" style="animation-delay: -4s;"></i>
<i class="fa-solid fa-sun floating-icon text-amber-300 text-4xl bottom-16 left-10" style="animation-delay: -1s;"></i>

<div class="h-screen w-screen flex flex-col p-2 md:p-3 overflow-hidden relative z-10 bg-slate-950/50 backdrop-blur-[2px]">
    <!-- Top Header / Control Bar with Omani National Theme -->
    <header class="flex justify-between items-center bg-slate-900/95 border-2 border-amber-400/70 rounded-2xl px-4 py-2 mb-2 shadow-[0_0_20px_rgba(251,191,36,0.25)] backdrop-blur-md shrink-0 h-14 md:h-16 relative overflow-hidden">
        <!-- Top Oman Flag Color Bar Accent -->
        <div class="absolute top-0 left-0 right-0 h-1.5 oman-flag-strip"></div>
        
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-red-600 via-emerald-600 to-amber-400 flex items-center justify-center text-white shadow-lg text-xl transform hover:rotate-12 transition border border-amber-300">
                🇴🇲
            </div>
            <div>
                <h1 class="text-lg md:text-2xl font-game text-transparent bg-clip-text bg-gradient-to-r from-red-400 via-amber-300 to-emerald-400 tracking-wide drop-shadow-sm flex items-center gap-2">
                    OMAN NATIONAL DAY SCIENCE CHALLENGE 🇴🇲
                </h1>
                <p class="text-xs md:text-sm text-amber-300 font-extrabold tracking-wide">Interactive 4-Group Game • National Day Celebration 🎉</p>
            </div>
        </div>

        <!-- Global Actions -->
        <div class="flex items-center space-x-2.5">
            <button onclick="resetAllGames()" class="bg-gradient-to-r from-red-600 via-emerald-600 to-amber-500 hover:brightness-110 text-white font-game py-2 px-4 rounded-xl text-xs md:text-sm flex items-center gap-2 shadow-lg transition active:scale-95 border border-amber-300">
                <i class="fa-solid fa-rotate-right"></i> <span>Reset All Groups</span>
            </button>
            <button onclick="toggleAudio()" id="mute-btn" class="bg-slate-800/90 hover:bg-slate-700 text-amber-300 border border-slate-700 font-bold p-2.5 rounded-xl transition shadow-md">
                <i class="fa-solid fa-volume-high text-sm md:text-base"></i>
            </button>
        </div>
    </header>

    <!-- 4-Quadrant Game Grid with Omani National Colors -->
    <main class="grid grid-cols-1 md:grid-cols-2 gap-2.5 flex-1 overflow-hidden min-h-0">
        
        <!-- GROUP 1: OMAN RED TEAM -->
        <div id="group-1" class="quadrant-card bg-slate-900/90 border-2 border-red-500/80 rounded-2xl p-2.5 md:p-3 flex flex-col justify-between relative overflow-hidden shadow-2xl glow-red min-h-0 h-full">
            <!-- Group Header -->
            <div class="flex justify-between items-center border-b border-red-500/40 pb-1.5 mb-1 shrink-0">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-red-500 to-red-700 border border-red-400 flex items-center justify-center text-white shadow-md text-sm font-bold">
                        🇴🇲 1
                    </div>
                    <div>
                        <span class="text-[10px] md:text-xs font-black tracking-widest text-red-400 uppercase block">Group 1 • Red Falcons</span>
                        <h2 class="font-game text-sm md:text-base text-red-200 tracking-wide">Sound & Motion Energy</h2>
                    </div>
                </div>
                <div class="bg-slate-950/90 border border-amber-400/80 px-3 py-1 rounded-full flex items-center gap-1.5 shadow-lg">
                    <i class="fa-solid fa-star text-amber-400 text-sm"></i>
                    <span id="score-1" class="font-game text-sm md:text-base text-amber-300">0</span>
                </div>
            </div>

            <!-- Content Area -->
            <div id="content-1" class="flex-1 flex flex-col justify-between overflow-hidden relative">
                <!-- Question loaded dynamically -->
            </div>

            <!-- Feedback Overlay Anchor -->
            <div id="feedback-1" class="absolute inset-0 pointer-events-none flex items-center justify-center z-30"></div>
        </div>

        <!-- GROUP 2: OMAN GREEN TEAM -->
        <div id="group-2" class="quadrant-card bg-slate-900/90 border-2 border-emerald-500/80 rounded-2xl p-2.5 md:p-3 flex flex-col justify-between relative overflow-hidden shadow-2xl glow-green min-h-0 h-full">
            <!-- Group Header -->
            <div class="flex justify-between items-center border-b border-emerald-500/40 pb-1.5 mb-1 shrink-0">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-500 to-green-700 border border-emerald-400 flex items-center justify-center text-white shadow-md text-sm font-bold">
                        🇴🇲 2
                    </div>
                    <div>
                        <span class="text-[10px] md:text-xs font-black tracking-widest text-emerald-400 uppercase block">Group 2 • Green Palms</span>
                        <h2 class="font-game text-sm md:text-base text-emerald-200 tracking-wide">Electrical Energy Transformation</h2>
                    </div>
                </div>
                <div class="bg-slate-950/90 border border-amber-400/80 px-3 py-1 rounded-full flex items-center gap-1.5 shadow-lg">
                    <i class="fa-solid fa-star text-amber-400 text-sm"></i>
                    <span id="score-2" class="font-game text-sm md:text-base text-amber-300">0</span>
                </div>
            </div>

            <!-- Content Area -->
            <div id="content-2" class="flex-1 flex flex-col justify-between overflow-hidden relative">
                <!-- Question loaded dynamically -->
            </div>

            <!-- Feedback Overlay Anchor -->
            <div id="feedback-2" class="absolute inset-0 pointer-events-none flex items-center justify-center z-30"></div>
        </div>

        <!-- GROUP 3: OMAN WHITE TEAM -->
        <div id="group-3" class="quadrant-card bg-slate-900/90 border-2 border-slate-300/80 rounded-2xl p-2.5 md:p-3 flex flex-col justify-between relative overflow-hidden shadow-2xl glow-white min-h-0 h-full">
            <!-- Group Header -->
            <div class="flex justify-between items-center border-b border-slate-400/40 pb-1.5 mb-1 shrink-0">
                <div class="flex items-center gap-2.5">
                    <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-slate-100 to-slate-300 border border-white flex items-center justify-center text-slate-950 shadow-md text-sm font-bold">
                        🇴🇲 3
                    </div>
                    <div>
                        <span class="text-[10px] md:text-xs font-black tracking-widest text-slate-300 uppercase block">Group 3 • White Forts</span>
                        <h2 class="font-game text-sm md:text-base text-slate-100 tracking-wide">Heat Energy Dissipation</h2>
                    </div>
                </div>
                <div class="bg-slate-950/90 border border-amber-400/80 px-3 py-1 rounded-full flex items-center gap-1.5 shadow-lg">
